<!doctype html>
<!--
  Source of src/SBGVR/Assets/meta-button-prompts.png: the button prompt icons SBGVR shows while you play with
  Meta Quest Touch controllers. Every icon is SBGVR's own drawing: white-lettered outline shapes in the left
  (blue) or right (orange) controller's colour, with a dark edge so they read on light backgrounds too.
  Thumbsticks are a double ring with L or R, triangles for a direction and a notch for a press; triggers
  (LT, RT) and the A, B, X, Y and Menu buttons are round buttons with their side showing; grip buttons (LG, RG)
  are a tapered pill with the controller's side as a bracket. render.py saves #atlas.

  The cell order below is the one Hud/MetaButtonPrompts.cs uses (GlyphNames); keep the two the same.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 600; src: url(../controller-layout/fonts/inter-latin-600-normal.woff2) format("woff2"); }
html, body { margin: 0; background: transparent; }
#atlas { position: relative; width: 1024px; height: 1024px; }
#atlas svg { position: absolute; width: 128px; height: 128px; overflow: visible; }
</style>
</head>
<body>
<div id="atlas"></div>
<script>
const NS = "http://www.w3.org/2000/svg";
const W = "#FFFFFF", FILL = "#1C1C20", LW = 4.5;           // letters and arrows, inside of shapes, line width
const SIDE = { Left: "#2563EB", Right: "#C2410C" };       // the controller layout's left and right colours
const CAP_SIDE = { A: "Right", B: "Right", X: "Left", Y: "Left", Menu: "Left" };

// Cell order: must match GlyphNames in Hud/MetaButtonPrompts.cs.
const GLYPHS = [];
for (const side of ["Left", "Right"]) {
  for (const dir of ["", "Up", "Down", "LeftDir", "RightDir", "Horizontal", "Vertical", "Press"])
    GLYPHS.push({ name: `Stick${side}${dir ? "_" + dir : ""}`, kind: "stick", side, dir });
  GLYPHS.push({ name: `Trigger${side}`, kind: "part", side, part: "trigger" });
  GLYPHS.push({ name: `Grip${side}`, kind: "part", side, part: "grip" });
}
for (const cap of ["A", "B", "X", "Y", "Menu"]) GLYPHS.push({ name: `Button${cap}`, kind: "cap", cap });
for (const [grip, stick, cap] of [["Left", "Right", "B"], ["Right", "Left", "Y"]]) {
  for (const dir of ["", "Up", "Down", "LeftDir", "RightDir", "Horizontal", "Vertical"])
    GLYPHS.push({ name: `Grip${grip}+Stick${stick}${dir ? "_" + dir : ""}`, kind: "combo", grip, inner: { kind: "stick", side: stick, dir } });
  GLYPHS.push({ name: `Grip${grip}+Button${cap}`, kind: "combo", grip, inner: { kind: "cap", cap } });
}

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function label(g, text, x, y, size) {
  el("text", { x, y: y + size * 0.36, "text-anchor": "middle", "font-family": "Inter", "font-weight": 600,
               "font-size": size, fill: W }, g).textContent = text;
}

// A solid triangle pointing in dir, its tip a from (cx, cy).
function tri(g, cx, cy, dir, a) {
  const pts = { Up: [[0, -1], [-1, 0.45], [1, 0.45]], Down: [[0, 1], [-1, -0.45], [1, -0.45]],
                LeftDir: [[-1, 0], [0.45, -1], [0.45, 1]], RightDir: [[1, 0], [-0.45, -1], [-0.45, 1]] }[dir];
  el("polygon", { points: pts.map(([u, v]) => `${cx + u * a},${cy + v * a}`).join(" "), fill: W,
                  stroke: W, "stroke-width": 2, "stroke-linejoin": "round" }, g);
}

// The press mark: a triangle pointing down into the top of a ring, with a gap cut around it.
function notch(g, cx, top, color) {
  el("polygon", { points: `${cx - 11},${top - 9} ${cx + 11},${top - 9} ${cx},${top + 7}`, fill: color,
                  stroke: FILL, "stroke-width": 4, "stroke-linejoin": "round", "paint-order": "stroke" }, g);
}

// A round button seen slightly from the front: its side shows as a crescent under it.
function button(g, cx, cy, r, side) {
  el("circle", { cx, cy: cy + r * 0.2, r, fill: SIDE[side] }, g);
  el("circle", { cx, cy, r: r + 2.5, fill: FILL }, g);
  el("circle", { cx, cy, r: r - LW / 2, fill: FILL, stroke: SIDE[side], "stroke-width": LW }, g);
}

// A thumbstick from above: a double ring with L or R, triangles for a direction, a notch for a press.
function drawStick(g, side, dir) {
  const arrows = { Up: ["Up"], Down: ["Down"], LeftDir: ["LeftDir"], RightDir: ["RightDir"],
                   Horizontal: ["LeftDir", "RightDir"], Vertical: ["Up", "Down"] }[dir] || [];
  const R = arrows.length ? 30 : dir === "Press" ? 38 : 42, cx = 64, cy = 64 + (dir === "Press" ? 6 : 0);
  el("circle", { cx, cy, r: R, fill: FILL, stroke: SIDE[side], "stroke-width": LW }, g);
  el("circle", { cx, cy, r: R * 0.7, fill: FILL, stroke: SIDE[side], "stroke-width": LW - 1 }, g);
  label(g, side[0], cx, cy, R * 0.78);
  for (const d of arrows) {
    const o = R + 15, off = { Up: [0, -o], Down: [0, o], LeftDir: [-o, 0], RightDir: [o, 0] }[d];
    tri(g, cx + off[0], cy + off[1], d, 9);
  }
  if (dir === "Press") notch(g, cx, cy - R, SIDE[side]);
}

function drawTrigger(g, side) { button(g, 64, 60, 38, side); label(g, side[0] + "T", 64, 60, 30); }

function drawCap(g, cap) {
  button(g, 64, 60, 36, CAP_SIDE[cap]);
  if (cap === "Menu") for (const k of [-1, 0, 1]) el("rect", { x: 47, y: 60 + k * 11 - 2.5, width: 34, height: 5, rx: 2.5, fill: W }, g);
  else label(g, cap, 64, 60, 34);
}

// The grip button: a tapered pill with the controller's side as a bracket on the outer side.
function drawGrip(g, side) {
  const s = side === "Left" ? 1 : -1, cx = 64 + s * 6, cy = 64;
  el("path", { d: `M ${cx - 34} ${cy - 20} L ${cx + 34} ${cy - 20} Q ${cx + 40} ${cy - 20} ${cx + 37} ${cy - 13} L ${cx + 30} ${cy + 15}
                   Q ${cx + 28} ${cy + 20} ${cx + 22} ${cy + 20} L ${cx - 22} ${cy + 20} Q ${cx - 28} ${cy + 20} ${cx - 30} ${cy + 15}
                   L ${cx - 37} ${cy - 13} Q ${cx - 40} ${cy - 20} ${cx - 34} ${cy - 20} Z`,
               fill: FILL, stroke: SIDE[side], "stroke-width": LW, "stroke-linejoin": "round" }, g);
  const bx = cx - s * 47;
  el("path", { d: `M ${bx + s * 8} ${cy - 22} Q ${bx - s * 6} ${cy} ${bx + s * 8} ${cy + 22}`, fill: "none",
               stroke: SIDE[side], "stroke-width": LW, "stroke-linecap": "round" }, g);
  label(g, side[0] + "G", cx, cy - 1, 28);
}

function draw(g, gl) {
  if (gl.kind === "stick") drawStick(g, gl.side, gl.dir);
  else if (gl.kind === "cap") drawCap(g, gl.cap);
  else (gl.part === "trigger" ? drawTrigger : drawGrip)(g, gl.side);
}

// Icons of a family share one scale, so their rings and letters match in size.
function family(gl) {
  if (gl.kind === "combo") return "combo";
  if (gl.kind === "stick" && gl.dir && gl.dir !== "Press") return "arrows";
  if (gl.kind === "part" && gl.part === "grip") return "grip";
  return "round";
}

function render() {
  const atlas = document.getElementById("atlas"), cells = [];
  GLYPHS.forEach((gl, n) => {
    const svg = el("svg", { viewBox: "0 0 128 128" }, atlas);
    svg.style.left = (n % 8) * 128 + "px"; svg.style.top = Math.floor(n / 8) * 128 + "px";
    // A dark edge round every shape, so the icons read on light backgrounds too.
    const f = el("filter", { id: "edge" + n, x: "-10%", y: "-10%", width: "120%", height: "120%" }, el("defs", {}, svg));
    el("feMorphology", { in: "SourceAlpha", operator: "dilate", radius: 2.5, result: "d" }, f);
    el("feFlood", { "flood-color": "#0E0E11", "flood-opacity": 0.9 }, f);
    el("feComposite", { in2: "d", operator: "in", result: "o" }, f);
    const m = el("feMerge", {}, f); el("feMergeNode", { in: "o" }, m); el("feMergeNode", { in: "SourceGraphic" }, m);
    const outer = el("g", { filter: `url(#edge${n})` }, svg), fit = el("g", {}, outer), root = el("g", {}, fit);
    if (gl.kind === "combo") {
      // Hold the grip button (top) and use the other control (below).
      drawGrip(el("g", { transform: "translate(64 27) scale(0.56) translate(-64 -64)" }, root), gl.grip);
      draw(el("g", { transform: "translate(64 83) scale(0.66) translate(-64 -64)" }, root), gl.inner);
    } else draw(root, gl);
    cells.push({ fit, root, family: family(gl) });
  });
  // Fill the cell as the game's own icons do, each drawing centred on its cell, every family at its largest
  // scale that keeps all its icons inside the cell, with room left for the lines and the edge.
  const scale = {};
  for (const c of cells) {
    const b = c.root.getBBox();
    const e = Math.max(64 - b.x, b.x + b.width - 64, 64 - b.y, b.y + b.height - 64);
    scale[c.family] = Math.min(scale[c.family] || Infinity, 53 / e);
  }
  for (const c of cells)
    c.fit.setAttribute("transform", `translate(64 64) scale(${scale[c.family]}) translate(-64 -64)`);
  return GLYPHS.map(g => g.name);
}
</script>
</body>
</html>
